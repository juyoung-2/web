<!--
<ul> 목록 태그

1. 순서가 없는 태그이다.
2. 목록을 나열하여 메뉴를 만드는 용도로도 사용한다.
3. type 속성
1) type = "disc"   : ● , default값
2) type = "circle" : ○
3) type = "square" : ■
-->

<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>unordered list</title>
</head>
<body>
	<h1> &lt;순서 없는 목록 &gt; </h1>
	<ul type = "disc">
		<li>Tiger</li>
		<li>Lion</li>
		<li>Snake</li>
	</ul>
	<hr />
	<ul type = "circle">
		<li>C</li>
		<li>JAVA</li>
		<li>Database</li>
		<li>Web</li>
	</ul>
	<hr />
	<ul type = "square">
		<li>HTML</li>
		<li>CSS</li>
		<li>Java Script</li>
	</ul>
</body>
</html>

<!--
	<ol>목록태그

	1. 순서가 있는 태그이다.
	2. type 속성
		1) type = "1" : 1, 2, 3
		2) type = "I" : Ⅰ,Ⅱ,Ⅲ
		3) type = "i" : ⅰ,ⅱ,ⅲ
		4) type = "A" : A, B, C
		5) type = "a" : a, b, c
-->
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>ordered list</title>
</head>
<body>
	<h1>&lt;순서 있는 목록&gt;</h1>
	<ol type = "1" start="50">
		<li>오렌지</li>
		<li>딸기</li>
		<li>바나나</li>
	</ol>
	<hr/>
	<ol type ="I" start = "10"> <!--10번 부터 시작한다. -->
		<li>제주</li>
		<li>순천</li>
		<li>발리</li>
	</ol>
</body>
</html>

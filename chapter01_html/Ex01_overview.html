<!--
	HTML(Hyper Text Markup Language)
	- 웹페이지를 만들기 위한 표준 마크업 언어
	- 웹페이지의 구조(view)를 나타냄
	- 요소들(elements)로 이루어짐
	- HTML 요소들은 내용을 어떻게 보여줘야 할 지 브라우저(Browser)에 알려줌
	- HTML 요소들은 태그(<>)로 이루어져 있음
	- 선언 타입 : <tagname>content</tagname>
	- HTML 태그는 보통 시작 태그와 종료 태그의 쌍으로 이루어짐
	- 종료 태그가 없는 경우도 있음
	- 태그는 대소문자를 구분하지 않음
-->
<!DOCTYPE html><!--html 5  -->
<html lang="ko"><!-- 여는태그  -->
<head>
	<meta charset="UTF-8">
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>나의 첫 웹 페이지 타이틀</title>
</head>
<body>
	나의 첫 웹 페이지 본문
</body>
</html><!-- 닫는태그  -->

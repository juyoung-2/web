<!--  
	1. p
		- 보이는 대로 표시하지 않는다. (공백은 하나만 인정, 줄바꿈은 인정되지 않음)
		- 문단을 만들때 사용하는 태그이다. (문단이 끝나면 자동으로 줄 바꿈이 된다.)

	2. pre
		- 보이는 대로 표시한다.(공백 및 줄바꿈 까지)
-->

<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>paragraph tag</title>
</head>
<body>
	<p> 여기가 첫 번째 문단입니다.</p>
	<p> 여기가 두 번째 문단입니다.</p>
	<p> 여기가                       세 번째              문단입니다.</p> 
	<p> 여기가
	
	
	
	
	네 번째 문단입니다.</p>

	<hr>

	<pre> 여기가 첫 번째 문단입니다.</pre>
	<pre> 여기가 두 번째 문단입니다.</pre>
	<pre> 여기가              세 번째                 문단입니다.</pre>
	<pre> 여기가
        네 번째
        문단
        입니다.
	</pre>

</body>
</html>

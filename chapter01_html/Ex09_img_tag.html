<!--
	<img>태그
	
	1. 이미지를 삽입한다.
	2. 속성
		1) src : 이미지의 위치(경로)
		2) alt : 이미지 대신 표시할 텍스트(이미지가 안불러와졌을 경우)
	3. 경로 표시
		1) 절대 경로 : C:/workSpace/chapter01_html/images/google.jpg
        2) 상대 경로 : ./images/google.jpg	(/로 시작하면 컨텍스트 루트부터 시작)
        3) 주요 폴더 
                (1) .  : 현재폴더
                (2) .. : 상위 폴더
-->

<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>image tag</title>
</head>
<body>
	<!-- 
	* img 속성
	- alt(alternate) : 이미지 설명
	- src(source) : 이미지 출처(경로)
	- title : 이미지 타이틀
	- style : 이미지 스타일
	- width, height : 이미지 넓이, 높이
	
	* 파일 경로
	<img src="picture.jpg"> : 현재 페이지(Ex15_img_tag.html)와 같은 폴더에 위치한 이미지 파일
	<img src="images/picture.jpg"> : 현재 페이지와 같은 폴더(WebContent)에 
	위치한 images 폴더에 있는 이미지 파일
	<img src="/images/picture.jpg"> : 현재 페이지의 기본 루트에 위치한 
    image 폴더에 있는 이미지 파일
	<img scr="../picture.jpg"> : 현재 페이지의 상위 폴더에 위치한 이미지 파일                
    -->
	<h1>이미지 표시</h1>
	<img alt = "구글 이미지" src = "./images/google.jpg" >
	<!-- alt 속성을 신경써야 하는 이유 : 이미지를 제대로 가져오지 못할 경우 alt로 출력-->
	
	<h1>서버에 저장된 이미지</h1>
	<img src = "https://info2015pol.files.wordpress.com/2016/06/simpson1.png?w=1000">
	<!-- 이미지 주소 복사 -->

	<h1>크기를 조정한 이미지</h1>
	<img src = "images/google.jpg" width = "300">
	<!-- 너비(width)나 높이(height) 중 하나만 조정해도 함께 조정된다. -->
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <ul id="list"></ul>    
</body>
<script>
    const fruits = ["apple", "banana", "orange", "kiwi", "grape"];

    for(let f of fruits){
        let liEle = document.createElement('li');   // <li></li>
        let fName = document.createTextNode(f); // apple
        liEle.appendChild(fName);   // <li>apple</li>
        document.getElementById("list").appendChild(liEle);
    }

</script>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div>
        <h1>DOM</h1>
        <p class="ex">Document</p>
        <p class="ex">Object</p>
        <p>Model</p>
    </div>
</body>
<script>
    // 아래 코드에서 클래스명이 "ex"인 요소들의 글자 색을
    // 빨간 색으로 변경하시오.

    // HTMLCollection
    // let list = document.getElementsByClassName('ex');

    // NodeList
    let list = document.querySelectorAll('.ex');

    list.forEach( i => {
        i.style.color = 'red';
        // i.setAttribute('style', 'color:red');
    });



</script>
</html>

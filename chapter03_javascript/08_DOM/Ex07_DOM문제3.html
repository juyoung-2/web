<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #box {
            width : 100px;
            height :100px;
            color : white;
            background-color: red;
            text-align: center;			/* 가로 방향 가운데 정렬  */
            display : table-cell;		/* 테이블의 셀로 변경하면 수직 정렬이 가능  */
            vertical-align: middle;		/* 세로 방향 가운데  정렬 */
        }
        #text {
            font-size: 2em;
            font-weight: bold;	
        }
    </style>
</head>
<body>
    <div id="box">
        <p id="text">빨</p>
    </div>
</body>
<script>
    // 1초 마다 색과 글자가 변경되도록 함수 rainbow를 작성하시오.
    let i = 0;
    let colors = ["red", "orange", "yellow", "green", "blue", "navy", "purple"];
    let contents = ["빨", "주", "노", "초", "파", "남" ,"보"];
    const rainbow = function(){
        const box = document.querySelector("#box");
        const text = document.querySelector("#text");

        box.style.backgroundColor = colors[i]; // 배경
        text.innerHTML = contents[i]; // 텍스트
        i++
        if(i == colors.length){
            i = 0;
        }

        setTimeout(rainbow, 1000);
    }
    rainbow();

    // 다른 방법)
    // const rainbow = setInterval(() => {
    //     box.style.background = colors[i]; // 박스 색상
    //     text.textContent = contents[i]; // 글자 내용
    //     i++;
    //     if (i >= colors.length) {
    //         i = 0; 
    //     }
    // }, 1000);

</script>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
</body>
<script>
    /*
        자기호출함수
        - 만들면 바로 호출되는 함수 -> 스스로 호출
        - 익명 함수를 ()로 묶는 형태
        - 다른 개발자와 충돌을 방지하기 위해서 사용 (함수 이름이 중복 될 여지가 있으므로)
    */

    (function(){
        console.log(`자기 호출 함수`);
    })();


</script>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div id="hello">안녕하세요</div>
</body>
<script>
    // 자바스크립트 주석 
    // 1. 한 줄 주석 : //
    // 2. 여러 줄 주석 : /**/

    // HTML 파일에서 자바스크립트를 사용하는 방법
	//	1. script 태그 안에서 자바스크립트 코드를 작성
	//		1) head 태그 안에서 script 태그를 포함
	//		2) body 태그 안에서 script 태그를 포함
	//	2. 자바스크립트 코드만을 포함한 .js 파일을 HTML 
    // 파일에서 링크
	//		=> 자바스크립트 코드가 있는 위치에서 실행

    // 1. 출력1. 경고창
    window.alert("Hello");
    alert("javascript");    // window 생략 가능

    // 2. 출력2. 콘솔창
    console.log("hello js");
    
    // 3. 출력3. 브라우저 화면
    document.write('Hello');
    document.write('<h1>');
    document.write('javscript');
    document.write('</h1>');
    
</script>
</html>
